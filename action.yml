name: OCI rsync
description: Rsync local path(s) to an OCI (or any SSH) host. Optional key passphrase via ssh-agent.
author: scholtzap

inputs:
  host:
    description: SSH host (IP or hostname)
    required: true
  ssh_key:
    description: Private SSH key contents
    required: true
  ssh_passphrase:
    description: Optional passphrase for the SSH key
    required: false
    default: ""
  remote_path:
    description: Absolute remote destination directory (no trailing slash required)
    required: true
  local_path:
    description: Local source path when paths is empty
    required: false
    default: "."
  paths:
    description: Newline-separated relative dirs/files to rsync into remote_path/<name>. When set, local_path is ignored.
    required: false
    default: ""
  delete:
    description: Pass rsync --delete (true/false). Prefer false when mirroring git-archive style deploys.
    required: false
    default: "false"
  excludes:
    description: Newline-separated rsync --exclude patterns
    required: false
    default: |
      .git/
      .github/
      .env
      .env.*
      __pycache__/
      .venv/
      node_modules/
  ssh_user:
    description: SSH username
    required: false
    default: ubuntu

runs:
  using: composite
  steps:
    - name: Configure SSH agent
      shell: bash
      env:
        OCI_SSH_KEY: ${{ inputs.ssh_key }}
        OCI_SSH_PASSPHRASE: ${{ inputs.ssh_passphrase }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        KEYFILE=$(mktemp)
        printf '%s\n' "$OCI_SSH_KEY" | tr -d '\r' > "$KEYFILE"
        chmod 600 "$KEYFILE"
        eval "$(ssh-agent -s)"
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        if [ -n "${OCI_SSH_PASSPHRASE:-}" ]; then
          export OCI_SSH_PASSPHRASE
          ASKPASS=$(mktemp)
          cat > "$ASKPASS" <<'EOF'
        #!/bin/sh
        printf '%s\n' "$OCI_SSH_PASSPHRASE"
        EOF
          chmod 700 "$ASKPASS"
          DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force \
            setsid -w ssh-add "$KEYFILE" </dev/null
          rm -f "$ASKPASS"
        else
          ssh-add "$KEYFILE"
        fi
        rm -f "$KEYFILE"
        ssh-keyscan -H "${{ inputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Rsync to remote
      shell: bash
      env:
        EXCLUDES: ${{ inputs.excludes }}
        PATHS: ${{ inputs.paths }}
        DELETE_FLAG: ${{ inputs.delete }}
        REMOTE_ROOT: ${{ inputs.remote_path }}
        SSH_USER: ${{ inputs.ssh_user }}
        HOST: ${{ inputs.host }}
        LOCAL_PATH: ${{ inputs.local_path }}
      run: |
        set -euo pipefail
        USER_HOST="${SSH_USER}@${HOST}"
        REMOTE_ROOT="${REMOTE_ROOT%/}"

        RSYNC_ARGS=(-az)
        if [ "$DELETE_FLAG" = "true" ]; then
          RSYNC_ARGS+=(--delete)
        fi
        while IFS= read -r line || [ -n "$line" ]; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -z "$line" ] && continue
          RSYNC_ARGS+=(--exclude="$line")
        done <<< "$EXCLUDES"

        do_rsync() {
          local src="$1"
          local dest="$2"
          echo "📤 rsync → ${dest}"
          rsync "${RSYNC_ARGS[@]}" -e "ssh -o StrictHostKeyChecking=no" "$src" "$dest"
        }

        if [ -n "${PATHS//[[:space:]]/}" ]; then
          while IFS= read -r p || [ -n "$p" ]; do
            p="${p#"${p%%[![:space:]]*}"}"
            p="${p%"${p##*[![:space:]]}"}"
            [ -z "$p" ] && continue
            if [ ! -e "$p" ]; then
              echo "⚠️  skip missing path: $p"
              continue
            fi
            if [ -d "$p" ]; then
              do_rsync "${p}/" "${USER_HOST}:${REMOTE_ROOT}/${p}/"
            else
              ssh -o StrictHostKeyChecking=no "$USER_HOST" "mkdir -p \"$(dirname "${REMOTE_ROOT}/${p}")\""
              do_rsync "$p" "${USER_HOST}:${REMOTE_ROOT}/${p}"
            fi
          done <<< "$PATHS"
        else
          src="$LOCAL_PATH"
          if [ -d "$src" ]; then
            do_rsync "${src%/}/" "${USER_HOST}:${REMOTE_ROOT}/"
          else
            do_rsync "$src" "${USER_HOST}:${REMOTE_ROOT}/"
          fi
        fi
        echo "✅ rsync complete"
